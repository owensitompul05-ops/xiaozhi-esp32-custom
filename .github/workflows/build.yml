name: Build Boards

on:
  push:
    branches:
      - main
      - ci/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build bread-compact-wifi-s3cam
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Board
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py bread-compact-wifi-s3cam

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_bread-compact-wifi-s3cam_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error